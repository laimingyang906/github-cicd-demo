name: Build, Push to ACR and Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 代码质量门禁（跑单元测试）
      - name: Set up Python and Run Tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pytest test_app.py
          # 如果测试不通过，流水线会在这里直接报错退出，后面的打包和部署全都会停止！

      - name: Log in to Aliyun ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ secrets.ACR_REGISTRY }} -u ${{ secrets.ACR_USERNAME }} --password-stdin

      - name: Build and push to ACR
        run: |
          IMAGE_TAG=${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/github-cicd-demo:latest
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG

      # Trivy 镜像漏洞扫描（安全左移）
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/github-cicd-demo:latest'
          format: 'table'
          exit-code: '0' # 如果是1，关键！只要扫出漏洞，立刻退出并报错
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH' # 只拦截致命和高危漏洞
          
  deploy:
    needs: build-and-push
    # 只有当 build-and-push 里面所有的步骤（包括测试和扫描）都成功后，这个才会执行
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Aliyun Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ secrets.ACR_REGISTRY }} -u ${{ secrets.ACR_USERNAME }} --password-stdin
            docker pull ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/github-cicd-demo:latest

            # 1. 启动新容器，加入 my-net 网络，并给一个临时别名
            docker rm -f my-web-app-new || true
            docker run -d --name my-web-app-new --network my-net ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/github-cicd-demo:latest

            # 2. 健康检查（直接通过容器名测试，不需要宿主机的端口了）
            echo "等待新容器启动..."
            HEALTHY=false
            for i in {1..10}; do
                if docker exec myapp-nginx curl -s -o /dev/null -w "%{http_code}" http://my-web-app-new:8000 | grep -q "200"; then
                    echo "✅ 新容器健康检查通过！"
                    HEALTHY=true
                    break
                fi
                sleep 2
            done

            if [ "$HEALTHY" != "true" ]; then
                echo "❌ 致命错误：新容器启动失败！"
                docker logs my-web-app-new
                docker rm -f my-web-app-new
                exit 1
            fi

            # 3. 修改 Nginx 配置，指向新容器的名字
            CONF_FILE="/root/myapp-nginx/conf.d/default.conf"
            sed -i 's/proxy_pass http:\/\/my-web-app:8000;/proxy_pass http:\/\/my-web-app-new:8000;/' $CONF_FILE
            docker exec myapp-nginx nginx -s reload

            # 4. 删除旧容器
            docker rm -f my-web-app || true
            
            # 5. 把新容器改名为 my-web-app，并修改 Nginx 配置改回来，完成无缝交接！
            docker rename my-web-app-new my-web-app
            sed -i 's/proxy_pass http:\/\/my-web-app-new:8000;/proxy_pass http:\/\/my-web-app:8000;/' $CONF_FILE
            docker exec myapp-nginx nginx -s reload
  notify:
    # needs 表示它依赖前面的任务；always() 表示无论前面成功还是失败，它都会运行
    needs: [build-and-push, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send DingTalk Notification
        run: |
          # 判断前置任务的状态
          if [ "${{ needs.build-and-push.result }}" == "success" ] && [ "${{ needs.deploy.result }}" == "success" ]; then
            STATUS="✅ 成功"
            COLOR="info"
          else
            STATUS="❌ 失败"
            COLOR="warning"
          fi
          
          # 构造 JSON 消息体，注意消息里必须包含你设置的“自定义关键词”（比如“部署”）
          curl -H "Content-Type: application/json" \
          -d "{
            \"msgtype\": \"markdown\",
            \"markdown\": {
              \"title\": \"CI/CD 部署通知\",
              \"text\": \"### 🚀 自动化部署通知\n\n- **状态**: ${STATUS}\n- **项目**: ${{ github.repository }}\n- **分支**: ${{ github.ref_name }}\n- **提交人**: ${{ github.actor }}\n- **提交信息**: ${{ github.event.head_commit.message }}\n\n[点击查看日志](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\"
            }
          }" \
          ${{ secrets.DINGTALK_WEBHOOK }}
