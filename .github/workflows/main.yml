name: Build, Push and Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Aliyun Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # 登录 GitHub 镜像仓库（如果是私有仓库必须登录，公开仓库无所谓，写着更严谨）
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # 拉取最新镜像
            docker pull ghcr.io/${{ github.repository }}:latest
            
            # 删除旧容器（如果有的话，|| true 表示报错也不中断）
            docker stop my-web-app || true
            docker rm my-feed-app || true
            
            # 运行新容器，映射到服务器的 8080 端口（注意：你服务器上的 8080 可能被占用，如果占用了请换成 8081）
            docker run -d --name my-web-app -p 8080:8000 ghcr.io/${{ github.repository }}:latest
