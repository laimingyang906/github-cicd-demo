name: Build, Push and Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Aliyun Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # 1. 使用国内代理拉取镜像（这里换成了南京大学代理）
            docker pull ghcr.nju.edu.cn/${{ github.repository }}:latest
            
            # 2. 删除旧的容器（如果存在，|| true 防止报错中断）
            docker stop my-web-app || true
            docker rm my-web-app || true
            
            # 3. 运行新容器，映射到服务器的 8080 端口（注意这里的镜像地址也要用代理）
            docker run -d --name my-web-app -p 8080:8000 ghcr.nju.edu.cn/${{ github.repository }}:latest
