name: Build, Push to ACR and Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 👇 新增 1：代码质量门禁（跑单元测试）
      - name: Set up Python and Run Tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pytest test_app.py
          # 如果测试不通过，流水线会在这里直接报错退出，后面的打包和部署全都会停止！

      - name: Log in to Aliyun ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ secrets.ACR_REGISTRY }} -u ${{ secrets.ACR_USERNAME }} --password-stdin

      - name: Build and push to ACR
        run: |
          IMAGE_TAG=${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/github-cicd-demo:latest
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG

      # 👇 新增 2：Trivy 镜像漏洞扫描（安全左移）
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/github-cicd-demo:latest'
          format: 'table'
          exit-code: '0' # 如果是1，关键！只要扫出漏洞，立刻退出并报错
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH' # 只拦截致命和高危漏洞
          
  deploy:
    needs: build-and-push
    # 只有当 build-and-push 里面所有的步骤（包括测试和扫描）都成功后，这个才会执行
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Aliyun Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ secrets.ACR_REGISTRY }} -u ${{ secrets.ACR_USERNAME }} --password-stdin
            docker pull ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/github-cicd-demo:latest

            # 1. 启动新容器（映射到 8081 端口）
            docker stop my-web-app-new || true
            docker rm my-web-app-new || true
            docker run -d --name my-web-app-new -p 8081:8000 ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/github-cicd-demo:latest

            # 2. 等待新容器启动
            echo "等待新容器启动..."
            sleep 3 

            # 3. 动态切换 Nginx 的端口 (注意路径和IP)
            CONF_FILE="/root/myapp-nginx/conf.d/default.conf"
            if grep -q "proxy_pass http://39.106.44.177:8080;" $CONF_FILE; then
                sed -i 's/proxy_pass http:\/\/39.106.44.177:8080;/proxy_pass http:\/\/39.106.44.177:8081;/' $CONF_FILE
            else
                sed -i 's/proxy_pass http:\/\/39.106.44.177:8081;/proxy_pass http:\/\/39.106.44.177:8080;/' $CONF_FILE
            fi
            
            # 4. Nginx 瞬间重载配置（此时流量已切到 8081，没有一秒钟断开）
            docker exec myapp-nginx nginx -s reload

            # 5. 停止并删除旧容器（8080）
            docker stop my-web-app || true
            docker rm my-web-app || true
            
            # 6. 给新容器改名，准备迎接下一次部署
            docker rename my-web-app-new my-web-app
  notify:
    # 关键：needs 表示它依赖前面的任务；always() 表示无论前面成功还是失败，它都会运行
    needs: [build-and-push, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send DingTalk Notification
        run: |
          # 判断前置任务的状态
          if [ "${{ needs.build-and-push.result }}" == "success" ] && [ "${{ needs.deploy.result }}" == "success" ]; then
            STATUS="✅ 成功"
            COLOR="info"
          else
            STATUS="❌ 失败"
            COLOR="warning"
          fi
          
          # 构造 JSON 消息体，注意消息里必须包含你设置的“自定义关键词”（比如“部署”）
          curl -H "Content-Type: application/json" \
          -d "{
            \"msgtype\": \"markdown\",
            \"markdown\": {
              \"title\": \"CI/CD 部署通知\",
              \"text\": \"### 🚀 自动化部署通知\n\n- **状态**: ${STATUS}\n- **项目**: ${{ github.repository }}\n- **分支**: ${{ github.ref_name }}\n- **提交人**: ${{ github.actor }}\n- **提交信息**: ${{ github.event.head_commit.message }}\n\n[点击查看日志](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\"
            }
          }" \
          ${{ secrets.DINGTALK_WEBHOOK }}
